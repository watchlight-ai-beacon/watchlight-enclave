[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watchlight-enclave"
version = "0.2.1"
description = "Watchlight AI Enclave — a governed, isolated runtime for autonomous AI agents."
readme = "README-pypi.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Watchlight AI" }]
keywords = [
    "ai-agents",
    "sandbox",
    "governance",
    "authorization",
    "cedar",
    "audit-trail",
    "evidence",
    "agent-security",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0", "cryptography>=42.0"]

# The sidebar on the package page. Without these the page has no route back to
# the source, which for a project whose claim is "read the verifier yourself"
# is the one link that has to be there.
[project.urls]
Homepage = "https://github.com/watchlight-ai-beacon/watchlight-enclave"
Source = "https://github.com/watchlight-ai-beacon/watchlight-enclave"
Documentation = "https://docs.watchlight.ai/enclave"
Changelog = "https://github.com/watchlight-ai-beacon/watchlight-enclave/blob/main/CHANGELOG.md"
Issues = "https://github.com/watchlight-ai-beacon/watchlight-enclave/issues"
"Security policy" = "https://github.com/watchlight-ai-beacon/watchlight-enclave/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = ["pytest>=8.3.4"]

[project.scripts]
wl-enclave = "wl_enclave.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wl_enclave"]

[tool.hatch.build.targets.sdist]
# A whitelist, not an exclude list. hatchling's default sdist is the whole
# working tree minus VCS ignores, which put .github/, .gitignore and the
# shoalscan baseline into the 0.2.0 candidate. The risk is not those files —
# it is that the default is open, so anything added to the repository later
# ships by default and nobody finds out until it is on an immutable index.
#
# tests/ is in deliberately. The package's claim is that a third party can
# check a bundle without trusting us, and the forgery tests are how they check
# that the verifier refuses what it says it refuses. crates/ is in for the same
# reason: the guard is where record-before-forward lives, so its source
# belongs with the distribution that claims it.
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/crates",
  "/README.md",
  "/README-pypi.md",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/pyproject.toml",
]
