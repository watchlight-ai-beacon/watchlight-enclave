# Publish `watchlight-enclave` to PyPI.
#
# Same method as `watchlight-beacon`'s `publish-watchlight-engine.yml`: PyPI
# Trusted Publishing over OIDC, manual trigger, dry-run by default, GitHub
# Environments scoping the publisher config. No long-lived API token exists
# anywhere — the runner mints a short-lived token per publish.
#
# ─── TWO DELIBERATE DIFFERENCES FROM THE ENGINE'S WORKFLOW ───
#
#   1. WE PUBLISH AN sdist. The engine is wheels-only because `maturin sdist`
#      vendors the full Rust source of a proprietary compiled engine, and an
#      sdist would hand over the exact thing the wheel exists to protect. The
#      opposite is true here: `watchlight-enclave` is Apache-2.0 and its whole
#      claim is that `wl-enclave verify` can be read and re-implemented by
#      someone who does not trust us. A source distribution serves that claim.
#      Do not copy the engine's wheels-only gate into this file.
#
#   2. ONE JOB, not build + publish. The engine needs a platform matrix; this
#      is pure Python and builds one universal wheel in seconds. Keeping it in
#      one job means the artifacts we publish are byte-for-byte the ones the
#      gates below inspected, with no upload/download round trip in between
#      where a different file could take their place.
#
# There is no TestPyPI path here, on purpose. A rehearsal index we do not use
# is a second publisher registration to keep in step with this file, and a
# config that is never exercised is the one most likely to be wrong when it
# finally matters. The dry run below is the rehearsal: it builds the real
# artifacts and runs every gate, and differs from a publish only in the upload.
#
# ─── OPERATOR PREREQUISITES (one-time, before the first publish) ───
#   1. Configure a PyPI **Trusted Publisher** (OIDC) for this workflow, at
#      https://pypi.org/manage/account/publishing/ — a *pending* publisher,
#      since the project does not exist yet. The first publish then creates it,
#      with no API token anywhere. Reserving the name with a placeholder upload
#      is unnecessary and would make the project personally owned.
#      ⚠️ Two namespaces with similar names: the PyPI org is `watchlight-ai`,
#      the GitHub org is `watchlight-ai-beacon`. This form wants the GitHub one
#      in Owner. If there is an organization selector, choose `watchlight-ai`
#      so the project is org-owned from the first upload rather than needing a
#      transfer later.
#        PyPI Project Name: watchlight-enclave
#        Owner:             watchlight-ai-beacon
#        Repository name:   watchlight-enclave
#        Workflow name:     publish-pypi.yml
#        Environment name:  pypi
#   2. Create the `pypi` GitHub Environment, optionally with a required
#      reviewer, so a publish is an explicit approved action. A reviewer gates
#      dry runs too, since the job declares the environment either way; both
#      are manual dispatches, so that is a click, not a loss of a capability.
#
# ─── HOW TO RUN ───
#   Rehearse from any ref — builds and validates, uploads nothing:
#     gh workflow run publish-pypi.yml --ref main
#   Publish, which must come from the release tag:
#     gh workflow run publish-pypi.yml --ref v0.2.1 -f dry_run=false
#
# ─── Action pinning ───
#   Third-party actions are SHA-pinned to an immutable commit with the
#   human-readable tag in a trailing comment. First-party `actions/*` follow
#   this repository's existing convention in ci.yml and float on a major tag.

name: Publish watchlight-enclave (PyPI)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate, but SKIP the upload to PyPI"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: "Build, validate${{ inputs.dry_run && ' (dry run)' || ', publish to PyPI' }}"
    runs-on: ubuntu-latest
    # Scopes the OIDC trusted-publisher config and can require an approver.
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC — trusted publishing mints a short-lived token
    steps:
      # A publish is immutable and a filename can never be reused, so the ref
      # it came from has to be the thing the tag names. A dry run stays open to
      # any ref: rehearsing from a branch is the whole point of it.
      - name: A publish must come from a release tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_REF: ${{ github.ref }}
        run: |
          case "$GH_REF" in
            refs/tags/v*) echo "Release tag: $GH_REF" ;;
            *) echo "::error::Publishing requires a release tag: gh workflow run publish-pypi.yml --ref v<X.Y.Z> -f dry_run=false (got $GH_REF)"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel and the sdist
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build twine
          python -m build
          ls -la dist

      - name: twine check
        run: python -m twine check --strict dist/*

      # The version is asserted three ways rather than trusted once. A wheel
      # whose version disagrees with the tag is the one mistake that cannot be
      # taken back: PyPI filenames are permanent, so 0.2.0 published from a
      # 0.1.0 tree can never be corrected in place.
      - name: The built version must agree with the package and the tag
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          declared="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          source_version="$(python -c 'import sys; sys.path.insert(0,"src"); import wl_enclave; print(wl_enclave.__version__)')"
          echo "pyproject: $declared"
          echo "__version__: $source_version"
          if [ "$declared" != "$source_version" ]; then
            echo "::error::pyproject.toml says $declared but wl_enclave.__version__ says $source_version"
            exit 1
          fi
          # Exactly one wheel and one sdist, both naming that version.
          test -f "dist/watchlight_enclave-${declared}-py3-none-any.whl" \
            || { echo "::error::no dist/watchlight_enclave-${declared}-py3-none-any.whl"; ls dist; exit 1; }
          test -f "dist/watchlight_enclave-${declared}.tar.gz" \
            || { echo "::error::no dist/watchlight_enclave-${declared}.tar.gz"; ls dist; exit 1; }
          case "$GH_REF" in
            refs/tags/v*)
              if [ "v${declared}" != "$GH_REF_NAME" ]; then
                echo "::error::tag $GH_REF_NAME does not match version $declared"
                exit 1
              fi
              echo "tag $GH_REF_NAME matches version $declared"
              ;;
            *) echo "::notice::not a tag ref; version/tag agreement not checked" ;;
          esac

      # The enclave-specific fail-closed gate, and the reason this file does
      # not reuse the engine's. hatchling's sdist takes what is in the tree, and
      # `wl-enclave keygen` writes Ed25519 private keys as .pem/.key files. A
      # developer who ran `keygen --path ./k.key` and then cut a release would
      # publish a signing key to an immutable index. Refuse rather than warn.
      - name: Fail closed — no key or credential material in the distributions
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, tarfile, zipfile, pathlib, re

          # Credential material and private state only. An earlier version of
          # this list also matched `.shoalscan`, which failed the 0.2.0
          # candidate over a committed scanner baseline — noise in an sdist is
          # a packaging question, settled by the sdist whitelist in
          # pyproject.toml, not a reason to refuse to publish. This gate is for
          # the thing that cannot be walked back: a private key, or a run's
          # evidence, on an immutable index.
          BAD = re.compile(
              r"(^|/)("
              r".*\.pem|.*\.key|.*\.p12|.*\.pfx|id_[a-z0-9]+|"
              r"\.env|\.envrc|\.netrc|"
              r"runs|\.venv"
              r")(/|$)"
          )

          problems = []
          for path in sorted(pathlib.Path("dist").iterdir()):
              if path.suffix == ".whl":
                  names = zipfile.ZipFile(path).namelist()
              elif path.name.endswith(".tar.gz"):
                  with tarfile.open(path) as tf:
                      names = tf.getnames()
              else:
                  problems.append(f"{path.name}: unexpected artifact type")
                  continue
              for name in names:
                  if BAD.search(name):
                      problems.append(f"{path.name}: contains {name}")
              # The verifier is the thing third parties are promised; a wheel
              # without it is not this package.
              if path.suffix == ".whl":
                  for required in ("wl_enclave/evidence.py", "wl_enclave/signing.py"):
                      if required not in names:
                          problems.append(f"{path.name}: missing {required}")

          if problems:
              print("::error::refusing to publish:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print("OK: no key or credential material, verifier present.")
          PY

      # Installs the built wheel in a clean virtualenv and runs it. This is the
      # gate that catches a dependency declared nowhere: `signing` imports
      # `cryptography` lazily, so a missing declaration would not surface until
      # a user ran keygen, by which point the release is permanent.
      - name: Smoke-test the built wheel from a clean environment
        run: |
          set -euo pipefail
          declared="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet "dist/watchlight_enclave-${declared}-py3-none-any.whl"
          got="$(/tmp/smoke/bin/wl-enclave --version)"
          echo "installed: $got"
          [ "$got" = "wl-enclave ${declared}" ] || { echo "::error::--version printed '$got', expected 'wl-enclave ${declared}'"; exit 1; }
          # Exercises the lazy cryptography import through the real entry point.
          XDG_CONFIG_HOME=/tmp/smoke-cfg /tmp/smoke/bin/wl-enclave keygen
          /tmp/smoke/bin/wl-enclave hosts --help >/dev/null
          echo "OK: the published wheel installs, signs and runs."

      - name: Publish (trusted publishing / OIDC)
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist
          # Stated rather than left to the action's default, so the index this
          # uploads to is readable here.
          repository-url: https://upload.pypi.org/legacy/
          print-hash: true

      - name: Dry run — nothing was uploaded
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run. Artifacts built and validated, upload skipped."
          ls -la dist
