version: 1

agent:
  name: coder
  command: ["python", "agent.py"]
  build: ./Dockerfile

runtime: docker

policy: ./policies

mcp:
  servers: []

egress:
  # The sandbox may reach exactly this, through the guard. Everything else is
  # refused and recorded.
  allow:
    - example.com:443

limits:
  memory: 1Gi
  cpus: 2
  pids: 256
  timeout: 5m
